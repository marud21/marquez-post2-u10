# Identificación del proyecto en SonarQube
sonar.projectKey=com.universidad:productos-service
sonar.projectName=Productos Service
sonar.projectVersion=1.0

# Ubicación del código fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java

# Binarios compilados (requerido para análisis Java)
sonar.java.binaries=target/classes

# Reporte de cobertura generado por JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Excluir clase principal (no tiene lógica relevante que analizar)
sonar.exclusions=**/*Application.java

# Servidor SonarQube local (levantado con Docker)
sonar.host.url=http://localhost:9000

# No bloquear el build si el Quality Gate falla (solo reportar)
sonar.qualitygate.wait=false
